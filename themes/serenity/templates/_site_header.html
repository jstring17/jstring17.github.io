<header class="site-header">
  <a class="site-name" href="{{ get_url(path='/') }}">{{ config.extra.name }}</a>
  <div class="site-actions">
    {% if config.build_search_index %}
    <button id="search-button" type="button" aria-label="Search posts" aria-haspopup="dialog" aria-controls="search-dialog" title="Search (/)" aria-keyshortcuts="/">
      {{ load_data(path="icon/search.svg") | safe }}
    </button>
    {% endif %}
    <button id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
      <span class="theme-icon">{{ load_data(path="icon/theme.svg") | safe }}</span>
    </button>
  </div>
  {# The home page says what the blog is about; posts keep the header to one line. #}
  {% if page is not defined and config.description %}
  <p class="site-tagline">{{ config.description }}</p>
  {% endif %}
</header>
