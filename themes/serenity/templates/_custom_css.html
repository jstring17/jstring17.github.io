    font-style: italic;

  /* Design tokens: index — monochrome, white paper */
  body {
    --primary-color: #171717;
    --primary-pale-color: #17171733;
    --primary-decoration-color: #1717170d;
    --bg-color: #ffffff;
    --block-bg-color: #f6f6f6;
    --code-highlight-bg-color: #ececec;
    --block-border-color: #e6e6e6;
    --text-color: #171717;
    --text-pale-color: #6e6e6e;

    --highlight-mark-color: #ffd60038;
    --title-color: #171717;
    --shine-color: #c9c9c9;

    --callout-note-color: #2f6fdd;
    --callout-tip-color: #3f8a3e;
    --callout-important-color: #8e44ad;
    --callout-warning-color: #a86d00;
    --callout-caution-color: #c8443a;
  }

  body.dark {
    --primary-color: #e8e8e8;
    --primary-pale-color: #e8e8e833;

    --callout-warning-color: #e0b55c;
    --callout-caution-color: #ea8a82;
  }

  /* typography */
  body {
    --main-font: 'Noto Sans KR', ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
    --code-font: 'CaskaydiaCove Nerd Font Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;

    --main-max-width: 720px;

    --block-radius: 0px;
    --detail-border-radius: var(--block-radius);
