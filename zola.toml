#:tombi schema.strict = false

base_url = "https://jstring17.github.io"
title = "Johyun Park"
description = "Notes and studies on AI, Bio, and Chem"
default_language = "en"
theme = "serenity"
output_dir = "public"
compile_sass = true
minify_html = false
build_search_index = true
generate_feeds = false
# Tags come from front matter; the home page filters them at /?tag=, so Zola does not build /tags/ pages.
taxonomies = [{ name = "tags", render = false }, { name = "categories", render = false }]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true

[markdown]
render_emoji = true
external_links_target_blank = false
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = false
github_alerts = true

[markdown.highlighting]
style = "class"
light_theme = "one-light"
dark_theme = "one-dark-pro"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

# =========================================================================================

[extra]
nav = [
  { name = "blog", path = "/" },
  # { name = "tags", path = "/tags" },
]

name = "Johyun Park"
handle = "johyun"
bio = ""
links = [
  { name = "GitHub", icon = "github", url = "https://github.com/johyun" },
]
blog_tags = ["AI", "Bio", "Market", "Research"]

blog_section_path = "/blog"

color_scheme = "auto"
back_link_text = "Back"

footer_copyright = "© 2026 Johyun Park"
footer_credits = false

not_found_error_text = "404 Not Found"
not_found_recover_text = "« back to home »"
